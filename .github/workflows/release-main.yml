name: Continuous Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Continuous Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

      - name: Prepare continuous release package
        run: |
          mkdir -p build_stage/devcontrol-dashboard
          cp -r backend build_stage/devcontrol-dashboard/
          cp -r tools build_stage/devcontrol-dashboard/
          cp start.py README.md AGENTS.md LICENSE build_stage/devcontrol-dashboard/
          mkdir -p build_stage/devcontrol-dashboard/frontend
          cp -r frontend/dist build_stage/devcontrol-dashboard/frontend/
          cp frontend/package.json build_stage/devcontrol-dashboard/frontend/

          cd build_stage
          zip -r ../devcontrol-dashboard-continuous.zip devcontrol-dashboard
          tar -czvf ../devcontrol-dashboard-continuous.tar.gz devcontrol-dashboard

      - name: Upload continuous build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: continuous-release-archive
          path: |
            devcontrol-dashboard-continuous.zip
            devcontrol-dashboard-continuous.tar.gz
          retention-days: 14

      - name: Update GitHub continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous Release (main)
          body: |
            Continuous release automatically built from the latest commit on `main`.
            
            **Commit**: `${{ github.sha }}`
            **Built at**: `${{ github.event.head_commit.timestamp || github.sha }}`
          draft: false
          prerelease: true
          files: |
            devcontrol-dashboard-continuous.zip
            devcontrol-dashboard-continuous.tar.gz
